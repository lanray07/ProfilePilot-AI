name: iOS Xcode Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      upload_to_app_store_connect:
        description: "Archive and upload to App Store Connect"
        required: true
        default: false
        type: boolean

jobs:
  simulator-build:
    name: Build ProfilePilot AI for Simulator
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project "ProfilePilotAI.xcodeproj" \
            -scheme "ProfilePilot AI" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

  app-store-archive:
    name: Archive and Upload to App Store Connect
    runs-on: macos-15
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[upload-asc]'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Validate required secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || secrets.TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID || secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID || secrets.APPSTORECONNECT_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || secrets.ASC_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APPSTORECONNECT_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY || secrets.ASC_PRIVATE_KEY || secrets.APP_STORE_CONNECT_PRIVATE_KEY || secrets.APPSTORECONNECT_PRIVATE_KEY }}
        run: |
          test -n "$APPLE_TEAM_ID" || (echo "Missing APPLE_TEAM_ID secret" && exit 1)
          test -n "$APPSTORE_KEY_ID" || (echo "Missing APPSTORE_KEY_ID secret" && exit 1)
          test -n "$APPSTORE_ISSUER_ID" || (echo "Missing APPSTORE_ISSUER_ID secret" && exit 1)
          test -n "$APPSTORE_PRIVATE_KEY" || (echo "Missing APPSTORE_PRIVATE_KEY secret" && exit 1)

      - name: Write App Store Connect API key
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY || secrets.ASC_PRIVATE_KEY || secrets.APP_STORE_CONNECT_PRIVATE_KEY || secrets.APPSTORECONNECT_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID || secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID || secrets.APPSTORECONNECT_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf "%s" "$APPSTORE_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          cp "$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || secrets.TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID || secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID || secrets.APPSTORECONNECT_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || secrets.ASC_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APPSTORECONNECT_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project "ProfilePilotAI.xcodeproj" \
            -scheme "ProfilePilot AI" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/ProfilePilotAI.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || secrets.TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID || secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID || secrets.APPSTORECONNECT_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || secrets.ASC_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APPSTORECONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ProfilePilotAI.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "ci/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProfilePilotAI-ipa
          path: ${{ runner.temp }}/export/*.ipa

      - name: Upload to App Store Connect
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID || secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID || secrets.APPSTORECONNECT_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || secrets.ASC_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APPSTORECONNECT_ISSUER_ID }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/private_keys
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/"*.ipa \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
