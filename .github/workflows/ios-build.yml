name: iOS Xcode Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      upload_to_app_store_connect:
        description: "Archive and upload to App Store Connect"
        required: true
        default: false
        type: boolean

jobs:
  simulator-build:
    name: Build ProfilePilot AI for Simulator
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project "ProfilePilotAI.xcodeproj" \
            -scheme "ProfilePilot AI" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

  app-store-archive:
    name: Archive and Upload to App Store Connect
    runs-on: macos-26
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[upload-asc]'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Validate required secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APPSTORECONNECT_KEY_ID: ${{ secrets.APPSTORECONNECT_KEY_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          API_KEY_ID: ${{ secrets.API_KEY_ID }}
          KEY_ID: ${{ secrets.KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APPSTORECONNECT_ISSUER_ID: ${{ secrets.APPSTORECONNECT_ISSUER_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          API_ISSUER_ID: ${{ secrets.API_ISSUER_ID }}
          ISSUER_ID: ${{ secrets.ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          APPSTORECONNECT_PRIVATE_KEY: ${{ secrets.APPSTORECONNECT_PRIVATE_KEY }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
          API_PRIVATE_KEY: ${{ secrets.API_PRIVATE_KEY }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          IOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          pick_secret() {
            local output_name="$1"
            shift
            for candidate_name in "$@"; do
              local candidate_value="${!candidate_name}"
              if [ -n "$candidate_value" ]; then
                {
                  echo "$output_name<<__${output_name}_VALUE__"
                  echo "$candidate_value"
                  echo "__${output_name}_VALUE__"
                } >> "$GITHUB_ENV"
                export "$output_name=$candidate_value"
                echo "Using $candidate_name for $output_name"
                return 0
              fi
            done
            echo "Missing $output_name secret. Checked: $*"
            return 1
          }

          pick_optional_secret() {
            local output_name="$1"
            shift
            for candidate_name in "$@"; do
              local candidate_value="${!candidate_name}"
              if [ -n "$candidate_value" ]; then
                {
                  echo "$output_name<<__${output_name}_VALUE__"
                  echo "$candidate_value"
                  echo "__${output_name}_VALUE__"
                } >> "$GITHUB_ENV"
                export "$output_name=$candidate_value"
                echo "Using $candidate_name for $output_name"
                return 0
              fi
            done
            echo "No optional $output_name secret found. Checked: $*"
            return 0
          }

          pick_secret APPLE_TEAM_ID APPLE_TEAM_ID TEAM_ID
          pick_secret APPSTORE_KEY_ID APPSTORE_KEY_ID APPSTORE_API_KEY_ID APP_STORE_KEY_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_API_KEY_ID APPSTORECONNECT_KEY_ID ASC_KEY_ID ASC_API_KEY_ID API_KEY_ID KEY_ID
          pick_secret APPSTORE_ISSUER_ID APPSTORE_ISSUER_ID APPSTORE_API_ISSUER_ID APP_STORE_ISSUER_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_ISSUER_ID APPSTORECONNECT_ISSUER_ID ASC_ISSUER_ID ASC_API_ISSUER_ID API_ISSUER_ID ISSUER_ID
          pick_secret APPSTORE_PRIVATE_KEY APPSTORE_PRIVATE_KEY APPSTORE_API_PRIVATE_KEY APP_STORE_PRIVATE_KEY APP_STORE_CONNECT_PRIVATE_KEY APP_STORE_CONNECT_API_PRIVATE_KEY APPSTORECONNECT_PRIVATE_KEY ASC_PRIVATE_KEY ASC_API_PRIVATE_KEY API_PRIVATE_KEY PRIVATE_KEY
          pick_optional_secret IOS_CERTIFICATE_P12_BASE64 IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_P12_BASE64 BUILD_CERTIFICATE_BASE64
          pick_optional_secret IOS_PROVISIONING_PROFILE_BASE64 IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 IOS_PROVISIONING_PROFILE_BASE64 BUILD_PROVISION_PROFILE_BASE64
          pick_optional_secret IOS_CERTIFICATE_PASSWORD IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_CERTIFICATE_PASSWORD P12_PASSWORD
          pick_optional_secret IOS_PROVISIONING_PROFILE_NAME IOS_PROVISIONING_PROFILE_NAME PROVISIONING_PROFILE_NAME

          if [ -n "$IOS_CERTIFICATE_P12_BASE64" ] && [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "SIGNING_ASSET_MODE=provided" >> "$GITHUB_ENV"
            echo "Using provided distribution certificate and provisioning profile secrets."
          else
            echo "SIGNING_ASSET_MODE=api-generated" >> "$GITHUB_ENV"
            echo "No complete certificate/profile secret pair found. The workflow will generate App Store signing assets through the App Store Connect API."
          fi

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf "%s" "$APPSTORE_PRIVATE_KEY" | perl -pe 's/\\n/\n/g' > "$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          cp "$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"

      - name: Install signing assets
        run: |
          set -o pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          CERTIFICATE_KEY_PATH="$RUNNER_TEMP/distribution.key"
          CERTIFICATE_CSR_PATH="$RUNNER_TEMP/distribution.csr"
          CERTIFICATE_CER_PATH="$RUNNER_TEMP/distribution.cer"
          CERTIFICATE_PEM_PATH="$RUNNER_TEMP/distribution.pem"
          PROFILE_PATH="$RUNNER_TEMP/appstore.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          GENERATED_P12_PASSWORD="$(uuidgen)"

          json_get() {
            /usr/bin/python3 -c "import functools,json,operator,sys; data=json.load(sys.stdin); print(functools.reduce(operator.getitem, '$1'.split('.'), data))"
          }

          json_get_first_id() {
            /usr/bin/python3 -c "import json,sys; data=json.load(sys.stdin); print(data['data'][0]['id'] if data.get('data') else '')"
          }

          make_jwt() {
            local now exp header payload signature
            now=$(date +%s)
            exp=$((now + 1200))
            b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            der_to_raw_ecdsa() {
              /usr/bin/python3 -c "exec(\"import sys\\ndata=sys.stdin.buffer.read()\\npos=0\\ndef read_len():\\n    global pos\\n    length=data[pos]\\n    pos+=1\\n    if length & 0x80:\\n        size=length & 0x7f\\n        length=int.from_bytes(data[pos:pos+size], 'big')\\n        pos+=size\\n    return length\\nif data[pos] != 0x30:\\n    raise SystemExit('Expected ECDSA DER sequence')\\npos+=1\\nread_len()\\ndef read_int():\\n    global pos\\n    if data[pos] != 0x02:\\n        raise SystemExit('Expected ECDSA DER integer')\\n    pos+=1\\n    length=read_len()\\n    value=int.from_bytes(data[pos:pos+length], 'big')\\n    pos+=length\\n    return value\\nr=read_int()\\ns=read_int()\\nsys.stdout.buffer.write(r.to_bytes(32, 'big') + s.to_bytes(32, 'big'))\")"
            }
            header=$(printf '{"alg":"ES256","kid":"%s","typ":"JWT"}' "$APPSTORE_KEY_ID" | b64url)
            payload=$(printf '{"iss":"%s","iat":%s,"exp":%s,"aud":"appstoreconnect-v1"}' "$APPSTORE_ISSUER_ID" "$now" "$exp" | b64url)
            signature=$(printf "%s.%s" "$header" "$payload" | openssl dgst -binary -sha256 -sign "$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" | der_to_raw_ecdsa | b64url)
            printf "%s.%s.%s" "$header" "$payload" "$signature"
          }

          asc_request() {
            local method="$1"
            local path="$2"
            local body="${3:-}"
            local response="$RUNNER_TEMP/asc-response.json"
            local status

            if [ -n "$body" ]; then
              status=$(curl -sS -o "$response" -w "%{http_code}" \
                -X "$method" \
                -H "Authorization: Bearer $ASC_JWT" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                -d "$body" \
                "https://api.appstoreconnect.apple.com$path")
            else
              status=$(curl -sS -o "$response" -w "%{http_code}" \
                -X "$method" \
                -H "Authorization: Bearer $ASC_JWT" \
                -H "Accept: application/json" \
                "https://api.appstoreconnect.apple.com$path")
            fi

            if [ "$status" -lt 200 ] || [ "$status" -gt 299 ]; then
              echo "App Store Connect API request failed: $method $path ($status)" >&2
              cat "$response" >&2
              exit 1
            fi

            cat "$response"
          }

          if [ "$SIGNING_ASSET_MODE" = "provided" ]; then
            printf "%s" "$IOS_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
            printf "%s" "$IOS_PROVISIONING_PROFILE_BASE64" | /usr/bin/base64 -D > "$PROFILE_PATH"
          else
            ASC_JWT="$(make_jwt)"

            openssl genrsa -out "$CERTIFICATE_KEY_PATH" 2048
            openssl req -new -key "$CERTIFICATE_KEY_PATH" -out "$CERTIFICATE_CSR_PATH" -subj "/CN=ProfilePilot AI GitHub Actions"
            CSR_CONTENT=$(/usr/bin/python3 -c "import json,pathlib; print(json.dumps(pathlib.Path('$CERTIFICATE_CSR_PATH').read_text())[1:-1])")
            CERT_BODY="{\"data\":{\"type\":\"certificates\",\"attributes\":{\"certificateType\":\"IOS_DISTRIBUTION\",\"csrContent\":\"$CSR_CONTENT\"}}}"
            CERT_RESPONSE=$(asc_request POST "/v1/certificates" "$CERT_BODY")
            CERTIFICATE_ID=$(printf "%s" "$CERT_RESPONSE" | json_get "data.id")
            CERTIFICATE_CONTENT=$(printf "%s" "$CERT_RESPONSE" | json_get "data.attributes.certificateContent")

            printf "%s" "$CERTIFICATE_CONTENT" | /usr/bin/base64 -D > "$CERTIFICATE_CER_PATH"
            openssl x509 -inform DER -in "$CERTIFICATE_CER_PATH" -out "$CERTIFICATE_PEM_PATH"
            openssl pkcs12 -export -out "$CERTIFICATE_PATH" -inkey "$CERTIFICATE_KEY_PATH" -in "$CERTIFICATE_PEM_PATH" -passout "pass:$GENERATED_P12_PASSWORD"
            IOS_CERTIFICATE_PASSWORD="$GENERATED_P12_PASSWORD"

            BUNDLE_RESPONSE=$(asc_request GET "/v1/bundleIds?filter%5Bidentifier%5D=com.profilepilotai.app")
            BUNDLE_ID=$(printf "%s" "$BUNDLE_RESPONSE" | json_get_first_id)
            if [ -z "$BUNDLE_ID" ]; then
              echo "Could not find App Store Connect bundle ID for com.profilepilotai.app."
              exit 1
            fi

            PROFILE_NAME="ProfilePilot AI App Store GitHub Actions $GITHUB_RUN_NUMBER"
            PROFILE_BODY="{\"data\":{\"type\":\"profiles\",\"attributes\":{\"name\":\"$PROFILE_NAME\",\"profileType\":\"IOS_APP_STORE\"},\"relationships\":{\"bundleId\":{\"data\":{\"type\":\"bundleIds\",\"id\":\"$BUNDLE_ID\"}},\"certificates\":{\"data\":[{\"type\":\"certificates\",\"id\":\"$CERTIFICATE_ID\"}]}}}}"
            PROFILE_RESPONSE=$(asc_request POST "/v1/profiles" "$PROFILE_BODY")
            PROFILE_CONTENT=$(printf "%s" "$PROFILE_RESPONSE" | json_get "data.attributes.profileContent")
            printf "%s" "$PROFILE_CONTENT" | /usr/bin/base64 -D > "$PROFILE_PATH"
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "${IOS_CERTIFICATE_PASSWORD:-}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          PROFILE_NAME_FROM_FILE=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PROFILE_PLIST")

          case "$PROFILE_APP_ID" in
            *".com.profilepilotai.app") ;;
            *)
              echo "The provisioning profile is for '$PROFILE_APP_ID', but this app needs com.profilepilotai.app."
              exit 1
              ;;
          esac

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          {
            echo "IOS_PROFILE_UUID=$PROFILE_UUID"
            echo "IOS_PROFILE_NAME=${IOS_PROVISIONING_PROFILE_NAME:-$PROFILE_NAME_FROM_FILE}"
          } >> "$GITHUB_ENV"

      - name: Archive
        run: |
          xcodebuild archive \
            -project "ProfilePilotAI.xcodeproj" \
            -scheme "ProfilePilot AI" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/ProfilePilotAI.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME"

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.profilepilotai.app</key>
              <string>$IOS_PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ProfilePilotAI.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProfilePilotAI-ipa
          path: ${{ runner.temp }}/export/*.ipa

      - name: Upload to App Store Connect
        env:
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/private_keys
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/"*.ipa \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
