name: iOS Xcode Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      upload_to_app_store_connect:
        description: "Archive and upload to App Store Connect"
        required: true
        default: false
        type: boolean

jobs:
  simulator-build:
    name: Build ProfilePilot AI for Simulator
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project "ProfilePilotAI.xcodeproj" \
            -scheme "ProfilePilot AI" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

  app-store-archive:
    name: Archive and Upload to App Store Connect
    runs-on: macos-15
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[upload-asc]'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Validate required secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APPSTORECONNECT_KEY_ID: ${{ secrets.APPSTORECONNECT_KEY_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          API_KEY_ID: ${{ secrets.API_KEY_ID }}
          KEY_ID: ${{ secrets.KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APPSTORECONNECT_ISSUER_ID: ${{ secrets.APPSTORECONNECT_ISSUER_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          API_ISSUER_ID: ${{ secrets.API_ISSUER_ID }}
          ISSUER_ID: ${{ secrets.ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          APPSTORECONNECT_PRIVATE_KEY: ${{ secrets.APPSTORECONNECT_PRIVATE_KEY }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
          API_PRIVATE_KEY: ${{ secrets.API_PRIVATE_KEY }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          IOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          pick_secret() {
            local output_name="$1"
            shift
            for candidate_name in "$@"; do
              local candidate_value="${!candidate_name}"
              if [ -n "$candidate_value" ]; then
                {
                  echo "$output_name<<__${output_name}_VALUE__"
                  echo "$candidate_value"
                  echo "__${output_name}_VALUE__"
                } >> "$GITHUB_ENV"
                echo "Using $candidate_name for $output_name"
                return 0
              fi
            done
            echo "Missing $output_name secret. Checked: $*"
            return 1
          }

          pick_optional_secret() {
            local output_name="$1"
            shift
            for candidate_name in "$@"; do
              local candidate_value="${!candidate_name}"
              if [ -n "$candidate_value" ]; then
                {
                  echo "$output_name<<__${output_name}_VALUE__"
                  echo "$candidate_value"
                  echo "__${output_name}_VALUE__"
                } >> "$GITHUB_ENV"
                echo "Using $candidate_name for $output_name"
                return 0
              fi
            done
            echo "No optional $output_name secret found. Checked: $*"
            return 0
          }

          pick_secret APPLE_TEAM_ID APPLE_TEAM_ID TEAM_ID
          pick_secret APPSTORE_KEY_ID APPSTORE_KEY_ID APPSTORE_API_KEY_ID APP_STORE_KEY_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_API_KEY_ID APPSTORECONNECT_KEY_ID ASC_KEY_ID ASC_API_KEY_ID API_KEY_ID KEY_ID
          pick_secret APPSTORE_ISSUER_ID APPSTORE_ISSUER_ID APPSTORE_API_ISSUER_ID APP_STORE_ISSUER_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_ISSUER_ID APPSTORECONNECT_ISSUER_ID ASC_ISSUER_ID ASC_API_ISSUER_ID API_ISSUER_ID ISSUER_ID
          pick_secret APPSTORE_PRIVATE_KEY APPSTORE_PRIVATE_KEY APPSTORE_API_PRIVATE_KEY APP_STORE_PRIVATE_KEY APP_STORE_CONNECT_PRIVATE_KEY APP_STORE_CONNECT_API_PRIVATE_KEY APPSTORECONNECT_PRIVATE_KEY ASC_PRIVATE_KEY ASC_API_PRIVATE_KEY API_PRIVATE_KEY PRIVATE_KEY
          pick_secret IOS_CERTIFICATE_P12_BASE64 IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_P12_BASE64 BUILD_CERTIFICATE_BASE64
          pick_secret IOS_PROVISIONING_PROFILE_BASE64 IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 IOS_PROVISIONING_PROFILE_BASE64 BUILD_PROVISION_PROFILE_BASE64
          pick_optional_secret IOS_CERTIFICATE_PASSWORD IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_CERTIFICATE_PASSWORD P12_PASSWORD
          pick_optional_secret IOS_PROVISIONING_PROFILE_NAME IOS_PROVISIONING_PROFILE_NAME PROVISIONING_PROFILE_NAME

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf "%s" "$APPSTORE_PRIVATE_KEY" | perl -pe 's/\\n/\n/g' > "$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          cp "$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"

      - name: Install manual signing assets
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/appstore.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf "%s" "$IOS_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          printf "%s" "$IOS_PROVISIONING_PROFILE_BASE64" | /usr/bin/base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "${IOS_CERTIFICATE_PASSWORD:-}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          PROFILE_NAME_FROM_FILE=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PROFILE_PLIST")

          case "$PROFILE_APP_ID" in
            *".com.profilepilotai.app") ;;
            *)
              echo "The provisioning profile is for '$PROFILE_APP_ID', but this app needs com.profilepilotai.app."
              exit 1
              ;;
          esac

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          {
            echo "IOS_PROFILE_UUID=$PROFILE_UUID"
            echo "IOS_PROFILE_NAME=${IOS_PROVISIONING_PROFILE_NAME:-$PROFILE_NAME_FROM_FILE}"
          } >> "$GITHUB_ENV"

      - name: Archive
        run: |
          xcodebuild archive \
            -project "ProfilePilotAI.xcodeproj" \
            -scheme "ProfilePilot AI" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/ProfilePilotAI.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME"

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.profilepilotai.app</key>
              <string>$IOS_PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ProfilePilotAI.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProfilePilotAI-ipa
          path: ${{ runner.temp }}/export/*.ipa

      - name: Upload to App Store Connect
        env:
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/private_keys
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/"*.ipa \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
