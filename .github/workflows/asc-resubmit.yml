name: Resubmit App Store Review

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  resubmit:
    name: Refresh assets and resubmit
    runs-on: macos-26
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[resubmit-asc]'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install App Store Connect upload dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install cryptography requests

      - name: Refresh metadata, assets, attach build, and resubmit
        env:
          APP_ID: "6775007316"
          TARGET_VERSION: "1.0"
          TARGET_BUILD_NUMBER: "6"
          APPSTORE_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          . .venv/bin/activate
          python .github/scripts/asc_resubmit_assets.py
